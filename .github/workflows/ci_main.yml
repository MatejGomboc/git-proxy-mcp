name: CI - Main Branch

permissions:
    contents: read
    actions: write

on:
    push:
        branches: [main]

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"

jobs:
    quick-checks:
        name: Quick Checks (fmt, docs, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Verify Rust toolchain pin consistency
              run: bash .github/scripts/check-toolchain-pin.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: rustfmt

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Check documentation
              run: cargo doc --no-deps --document-private-items
              env:
                RUSTDOCFLAGS: "-Dwarnings"

    build:
        name: Build (${{ matrix.os }})
        needs: quick-checks
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: clippy

            - name: Get Rust version
              id: rust-version
              shell: bash
              run: |
                # Cross-platform: use shasum on macOS, sha256sum elsewhere
                if command -v sha256sum &> /dev/null; then
                    HASH_CMD="sha256sum"
                else
                    HASH_CMD="shasum -a 256"
                fi
                echo "version=$(rustc --version | $HASH_CMD | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Restore Rust cache
              id: cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/.rustc_info.json
                    target/.cargo-lock
                    target/debug/deps/
                    target/debug/build/
                    target/debug/.fingerprint/
                    target/debug/incremental/
                    target/release/deps/
                    target/release/build/
                    target/release/.fingerprint/
                    target/release/incremental/
                key: rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
                restore-keys: |
                    rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

            - name: Run Clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build (debug)
              run: cargo build --verbose

            - name: Build (release)
              run: cargo build --release --verbose

            - name: Run tests
              run: cargo test --verbose

            # Save cache only on cache miss (tooling version changed)
            # continue-on-error suppresses "unable to reserve cache" warnings
            # when multiple jobs race to save (harmless, one will succeed)
            - name: Save Rust cache
              if: steps.cache-restore.outputs.cache-hit != 'true'
              continue-on-error: true
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/.rustc_info.json
                    target/.cargo-lock
                    target/debug/deps/
                    target/debug/build/
                    target/debug/.fingerprint/
                    target/debug/incremental/
                    target/release/deps/
                    target/release/build/
                    target/release/.fingerprint/
                    target/release/incremental/
                key: rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}

    # Note: the dedicated `integration` job has been merged into the
    # `coverage` job below — coverage instruments the release binary with
    # `-C instrument-coverage` and then runs the same Python integration
    # tests against it, so unit and integration coverage are merged into
    # a single Codecov report. Running both jobs separately would also
    # cause both to call `rebuild_fixture.py` in parallel, which force-
    # pushes to the same test repository (race condition).

    coverage:
        name: Code Coverage
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # `id-token: write` lets the codecov-action mint a short-lived OIDC
        # token instead of relying on a long-lived CODECOV_TOKEN secret.
        # `contents: read` is re-granted because job-level permissions
        # entirely override the workflow-level block.
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2.75.27
              with:
                tool: cargo-llvm-cov

            - name: Get Rust version
              id: rust-version
              shell: bash
              run: echo "version=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Restore Rust cache
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/
                key: rust-coverage-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
                restore-keys: |
                    rust-coverage-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

            - name: Configure git credentials for integration coverage
              run: |
                git config --global credential.helper store
                echo "https://x-access-token:${{ secrets.TEST_REPO_PAT }}@github.com" \
                    >> ~/.git-credentials
                git config --global user.name "integration-test"
                git config --global user.email "integration-test@ci.local"

            - name: Install git-lfs for integration coverage
              run: |
                sudo apt-get update
                sudo apt-get install -y git-lfs
                git lfs install

            # Run unit tests AND integration tests in a single shell so
            # both write `.profraw` files to the same `LLVM_PROFILE_FILE`
            # location set up by `show-env`. Splitting these into separate
            # steps (as the previous workflow did) ran them in different
            # subshells with cargo-llvm-cov's env scoped to whichever step
            # invoked it — the integration-test profraw files landed
            # somewhere the final `cargo llvm-cov report` didn't look, so
            # the merged-coverage feature claimed by PR #127 silently
            # produced unit-test-only numbers.
            #
            # show-env exposes RUSTFLAGS (instrumentation), LLVM_PROFILE_FILE
            # (where binaries write profraw), and CARGO_LLVM_COV_TARGET_DIR
            # (the workspace target directory — cargo-llvm-cov stopped
            # overriding CARGO_TARGET_DIR in 0.1.14, so the build lands in
            # the regular `target/release/`).
            - name: Run unit + integration tests under coverage instrumentation
              env:
                TEST_REPO_URL: ${{ secrets.TEST_REPO_URL }}
              run: |
                # One env setup for the whole coverage run.
                source <(cargo llvm-cov show-env --sh)
                cargo llvm-cov clean --workspace --profraw-only

                # Unit tests (instrumented via show-env's RUSTFLAGS).
                cargo test --all-features --workspace

                # Release binary (also instrumented).
                cargo build --release

                # Integration tests against the instrumented release binary.
                python3 tests/integration/rebuild_fixture.py
                GIT_PROXY_MCP_BINARY="$CARGO_LLVM_COV_TARGET_DIR/release/git-proxy-mcp" \
                    python3 tests/integration/test_mcp_tools.py

                # Diagnostic: confirm both unit-test and integration-test
                # profraw files landed where `cargo llvm-cov report` will
                # look. If this prints zero or only unit-test files, the
                # merge isn't happening and the next coverage number won't
                # reflect integration paths.
                echo "--- profraw files written ---"
                find target -name '*.profraw' -type f 2>/dev/null | head -20
                echo "--- total profraw count ---"
                find target -name '*.profraw' -type f 2>/dev/null | wc -l

            - name: Cleanup credentials
              if: always()
              run: rm -f ~/.git-credentials

            - name: Generate merged coverage report (lcov)
              run: cargo llvm-cov report --lcov --output-path lcov.info

            - name: Generate coverage summary
              run: cargo llvm-cov report --summary-only

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
              with:
                files: lcov.info
                use_oidc: true
                fail_ci_if_error: true
                verbose: true

    ci-success:
        name: CI Success
        needs: [quick-checks, build, coverage]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              id: check-results
              run: |
                # Coverage runs unit tests AND integration tests against the
                # instrumented binary. It may be skipped on forks that lack
                # the TEST_REPO_URL / TEST_REPO_PAT secrets.
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] ||
                   [[ "${{ needs.build.result }}" != "success" ]] ||
                   [[ "${{ needs.coverage.result }}" != "success" &&
                      "${{ needs.coverage.result }}" != "skipped" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"

            - name: Checkout repository
              if: success()
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Cleanup stale caches
              if: success()
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                script: |
                    const cleanupScript = require('./.github/scripts/cleanup-caches.js');
                    await cleanupScript({ github, context, core });
