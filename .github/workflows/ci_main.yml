name: CI - Main Branch

# Workflow-level permissions are read-only by default. Jobs that need
# elevated scope (e.g. cache cleanup needs `actions: write`) declare
# it on the job itself, following least-privilege.
permissions:
    contents: read

on:
    push:
        branches: [main]

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"

jobs:
    quick-checks:
        name: Quick Checks (fmt, docs, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Verify Rust toolchain pin consistency
              run: bash .github/scripts/check-toolchain-pin.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: rustfmt

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Check documentation
              run: cargo doc --no-deps --document-private-items
              env:
                RUSTDOCFLAGS: "-Dwarnings"

    build:
        name: Build (${{ matrix.os }})
        needs: quick-checks
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: clippy

            - name: Get Rust version
              id: rust-version
              shell: bash
              run: |
                # Cross-platform: use shasum on macOS, sha256sum elsewhere
                if command -v sha256sum &> /dev/null; then
                    HASH_CMD="sha256sum"
                else
                    HASH_CMD="shasum -a 256"
                fi
                echo "version=$(rustc --version | $HASH_CMD | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Restore Rust cache
              id: cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/.rustc_info.json
                    target/.cargo-lock
                    target/debug/deps/
                    target/debug/build/
                    target/debug/.fingerprint/
                    target/debug/incremental/
                    target/release/deps/
                    target/release/build/
                    target/release/.fingerprint/
                    target/release/incremental/
                key: rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
                restore-keys: |
                    rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

            - name: Run Clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build (debug)
              run: cargo build --verbose

            - name: Build (release)
              run: cargo build --release --verbose

            - name: Run tests
              run: cargo test --verbose

            # Save cache only on cache miss (tooling version changed)
            # continue-on-error suppresses "unable to reserve cache" warnings
            # when multiple jobs race to save (harmless, one will succeed)
            - name: Save Rust cache
              if: steps.cache-restore.outputs.cache-hit != 'true'
              continue-on-error: true
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/.rustc_info.json
                    target/.cargo-lock
                    target/debug/deps/
                    target/debug/build/
                    target/debug/.fingerprint/
                    target/debug/incremental/
                    target/release/deps/
                    target/release/build/
                    target/release/.fingerprint/
                    target/release/incremental/
                key: rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}

    # Note: the dedicated `integration` job has been merged into the
    # `coverage` job below — coverage instruments the release binary with
    # `-C instrument-coverage` and then runs the same Python integration
    # tests against it, so unit and integration coverage are merged into
    # a single Codecov report. Running both jobs separately would also
    # cause both to call `rebuild_fixture.py` in parallel, which force-
    # pushes to the same test repository (race condition).

    coverage:
        name: Code Coverage
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
              with:
                tool: cargo-llvm-cov

            - name: Get Rust version
              id: rust-version
              shell: bash
              run: echo "version=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Restore Rust cache
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/
                key: rust-coverage-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
                restore-keys: |
                    rust-coverage-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

            - name: Configure git credentials for integration coverage
              # Pass the PAT through an env var rather than ${{ secrets... }}
              # interpolation directly in the shell body — the env-var form
              # keeps the secret value out of the rendered script source
              # and matches GitHub's documented best practice.
              env:
                TEST_REPO_PAT: ${{ secrets.TEST_REPO_PAT }}
              run: |
                git config --global credential.helper store
                echo "https://x-access-token:${TEST_REPO_PAT}@github.com" \
                    >> ~/.git-credentials
                git config --global user.name "integration-test"
                git config --global user.email "integration-test@ci.local"

            - name: Install git-lfs for integration coverage
              run: |
                sudo apt-get update
                sudo apt-get install -y git-lfs
                git lfs install

            # Run tests + integration tests + report generation all in
            # a single shell so they share the env that `show-env --sh`
            # exports — most importantly `LLVM_PROFILE_FILE` (where
            # binaries write profraw) and `CARGO_LLVM_COV_TARGET_DIR`
            # (the workspace target directory). When `cargo llvm-cov
            # report` runs in a *separate* shell without these env vars,
            # it defaults to looking for profraw in `target/llvm-cov-target/`
            # instead of where show-env actually wrote them (`target/`),
            # and fails with "not found *.profraw files". This was the
            # observed failure on the post-PR-#134 main run; the previous
            # diagnostic confirmed profraw files did land in `target/`,
            # but the standalone report step in a fresh shell looked
            # elsewhere.
            #
            # Note on cargo-llvm-cov version history:
            # - 0.1.14 stopped overriding CARGO_TARGET_DIR — builds now
            #   land in the regular `target/release/`.
            # - 0.7.0 renamed `--export-prefix` to `--sh` (deprecated alias).
            - name: Run tests + generate coverage report under instrumentation
              env:
                TEST_REPO_URL: ${{ secrets.TEST_REPO_URL }}
              run: |
                # One env setup for the whole coverage run.
                source <(cargo llvm-cov show-env --sh)
                cargo llvm-cov clean --workspace --profraw-only

                # Unit tests (instrumented via show-env's RUSTFLAGS).
                cargo test --all-features --workspace

                # Release binary (also instrumented).
                cargo build --release

                # Integration tests against the instrumented release binary.
                # The binary path is hard-coded inside test_mcp_tools.py to
                # avoid an env-var taint flow into `subprocess.Popen`
                # (CodeQL py/command-line-injection). The instrumented
                # release build always lands at `./target/release/git-proxy-mcp`
                # because cargo-llvm-cov stopped overriding `CARGO_TARGET_DIR`
                # in 0.1.14, so no override is actually needed.
                python3 tests/integration/rebuild_fixture.py
                python3 tests/integration/test_mcp_tools.py

                # Diagnostic: confirm both unit-test and integration-test
                # profraw files landed where `cargo llvm-cov report` will
                # look. If this prints zero or only unit-test files, the
                # merge isn't happening and the next coverage number won't
                # reflect integration paths.
                echo "--- profraw files written ---"
                find target -name '*.profraw' -type f 2>/dev/null | head -20
                echo "--- total profraw count ---"
                find target -name '*.profraw' -type f 2>/dev/null | wc -l

                # Generate the merged report from inside this same shell
                # so `report` inherits the show-env env and looks for
                # profraw in the directory where the tests just wrote it.
                cargo llvm-cov report --lcov --output-path lcov.info
                cargo llvm-cov report --summary-only

            - name: Cleanup credentials
              if: always()
              run: rm -f ~/.git-credentials

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
              with:
                files: lcov.info
                fail_ci_if_error: true
                verbose: true
              env:
                CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    ci-success:
        name: CI Success
        needs: [quick-checks, build, coverage]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        # Cache cleanup deletes stale Actions caches via the REST API.
        permissions:
            contents: read
            actions: write

        steps:
            - name: Check if all jobs succeeded
              run: |
                # Coverage runs unit tests AND integration tests against the
                # instrumented binary. It may be skipped on forks that lack
                # the TEST_REPO_URL / TEST_REPO_PAT secrets.
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] ||
                   [[ "${{ needs.build.result }}" != "success" ]] ||
                   [[ "${{ needs.coverage.result }}" != "success" &&
                      "${{ needs.coverage.result }}" != "skipped" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"

            - name: Checkout repository
              if: success()
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Cleanup stale caches
              if: success()
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                script: |
                    const cleanupScript = require('./.github/scripts/cleanup-caches.js');
                    await cleanupScript({ github, context, core });
