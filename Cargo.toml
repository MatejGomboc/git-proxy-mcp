[package]
name = "git-proxy-mcp"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
description = "Secure Git proxy MCP server for AI assistants"
repository = "https://github.com/MatejGomboc/git-proxy-mcp"
readme = "README.md"
keywords = ["mcp", "git", "proxy", "ai", "llm"]
categories = ["development-tools", "command-line-utilities"]
authors = ["MatejGomboc"]

[lib]
name = "git_proxy_mcp"
path = "src/lib.rs"

[[bin]]
name = "git-proxy-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime (minimal features for MCP server)
# - rt: basic runtime for block_on
# - io-util: AsyncBufReadExt, AsyncWriteExt, BufReader
# - io-std: stdin(), stdout()
# - process: async Command for spawning git
# - macros: #[tokio::test] attribute
# - time: timeout for git process execution
# - signal: graceful shutdown handling (SIGTERM/SIGINT/Ctrl+C)
tokio = { version = "1", features = ["rt", "io-util", "io-std", "process", "macros", "time", "signal"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0.17"

# Glob pattern matching for repo allowlists
glob = "0.3"

# Platform-specific directories
dirs = "6.0.0"

# git2 library for in-process git operations (Tier 1 credential relay).
# 0.21 changed `default` features to empty (0.20 enabled "ssh" + "https"),
# so they must now be requested explicitly. "https" + "ssh" transitively
# enable the new "cred" feature that gates `Cred::credential_helper`.
git2 = { version = "0.21.0", features = ["https", "ssh"] }

# Compression for tar.gz archives
flate2 = "1.0"

# Tar archive creation (in-memory)
tar = "0.4"

# Base64 encoding for MCP responses
base64 = "0.22"

# URL parsing for credential helper
url = "2.5"

# Temporary directories for bare repos
tempfile = "3.10"

# HTTP client for LFS API requests (blocking for sync handlers)
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots", "blocking", "socks"], default-features = false }

[dev-dependencies]
# Async testing utilities
tokio-test = "0.4"
# HTTP mock server for testing LFS retry/error paths against a controllable
# fake endpoint (transient failures, 4xx/5xx mapping, download success).
mockito = "1.6"
# Property-based testing for parsers and validators (URL sanitisation,
# .gitmodules parsing, glob matching).
proptest = "1.6"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow multiple versions of transitive dependencies (we can't control these)
multiple_crate_versions = "allow"
